[package]
name = "nova_engine"
version = "0.1.0"
edition = "2021"
description = "A simple, personal 2D game engine"

[lib]
name = "nova_engine"
path = "src/lib.rs"

[dependencies]
# Windowing + event loop
winit = "0.29"

# GPU graphics API (works on Vulkan, Metal, DX12, WebGPU)
wgpu = "0.19"

# Math: Vec2, Vec3, Mat4, Quat
glam = "0.25"

# Audio
kira = { version = "0.9", features = ["mp3", "ogg", "wav"] }

# Image loading for textures
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Async runtime (wgpu needs it)
pollster = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

[dev-dependencies]
# for examples

[[example]]
name = "hello_window"
path = "examples/hello_window/main.rs"

[[example]]
name = "hello_sprite"
path = "examples/hello_sprite/main.rs"
